name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.match(process.env.RELEASE_TAG, /^\d+\.\d+\.\d+$/);
          for (const version of [manifest.version, pkg.version, lock.version, lock.packages[''].version]) {
            assert.equal(version, process.env.RELEASE_TAG, 'Release tag and package versions must match');
          }
          assert.ok(fs.existsSync(`docs/releases/${manifest.version}.md`), 'Release notes are required');
          NODE

      - name: Check types, lint, tests and production build
        run: npm run check

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create and Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
